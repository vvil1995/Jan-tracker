const TZ='Europe/Madrid',KEY='jan-tracker-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{records:[],sleep:null,breast:null,archived:[]}}catch{state={records:[],sleep:null,breast:null,archived:[]}};state.records ||= [];state.archived ||= [];let activeTab='sleep',feedType='bottle',wet=false,dirty=false,peeLevel='1',poopLevel='1';const $=id=>document.getElementById(id),now=()=>Date.now(),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),fmt=t=>new Intl.DateTimeFormat('ca-ES',{timeZone:TZ,hour:'2-digit',minute:'2-digit'}).format(new Date(t)),dateKey=t=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(t)),duration=ms=>{let m=Math.max(0,Math.floor(ms/60000));return `${Math.floor(m/60)} h ${m%60} min`},localInput=t=>{const parts=new Intl.DateTimeFormat('sv-SE',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(t));return parts.replace(' ','T')},fromInput=v=>{if(!v)return now();let [d,tm]=v.split('T');let [y,m,day]=d.split('-').map(Number),[h,min]=tm.split(':').map(Number);let guess=Date.UTC(y,m-1,day,h,min);for(let i=0;i<3;i++){let shown=localInput(guess),[sd,st]=shown.split('T'),[sy,sm,sday]=sd.split('-').map(Number),[sh,smin]=st.split(':').map(Number);let offset=Date.UTC(sy,sm-1,sday,sh,smin)-Date.UTC(y,m-1,day,h,min);guess-=offset}return guess},input=(id,t)=>`<input id="${id}" type="datetime-local" value="${localInput(t)}">`,add=r=>{state.records.push({...r,id:crypto.randomUUID()});save();render()},del=id=>{if(confirm('Vols eliminar aquest registre?')){state.records=state.records.filter(r=>r.id!==id);save();render()}},tab=t=>{activeTab=t;render()};function tick(){$('clock').textContent=fmt(now());$('today').textContent=new Intl.DateTimeFormat('ca-ES',{timeZone:TZ,day:'numeric',month:'short',year:'numeric'}).format(new Date());let timer=$('timer');if(timer&&state.sleep&&!state.sleep.wakePending)timer.textContent=clock function awakeWindows(){const t=now(),cut=t-86400000;const sleeps=state.records.filter(r=>r.type==='sleep'&&Number.isFinite(r.start)&&Number.isFinite(r.end)&&r.end>r.start).map(r=>({start:r.start,end:r.end}));if(state.sleep&&Number.isFinite(state.sleep.start))sleeps.push({start:state.sleep.start,end:t});sleeps.sort((a,b)=>a.start-b.start);const merged=[];for(const s of sleeps){const last=merged[merged.length-1];if(last&&s.start<=last.end)last.end=Math.max(last.end,s.end);else merged.push({...s})}const gaps=[];for(let i=1;i<merged.length;i++){let a=Math.max(merged[i-1].end,cut),b=Math.min(merged[i].start,t);if(b>a)gaps.push({start:a,end:b,ms:b-a})}const last=merged[merged.length-1];const current=!state.sleep&&last&&last.end<t?{start:Math.max(last.end,cut),end:t,ms:t-Math.max(last.end,cut)}:null;return {gaps,current,total:gaps.reduce((n,g)=>n+g.ms,0)+(current?.ms||0)}}
function lastFeed(){return state.records.filter(r=>(r.type==='breast'||r.type==='bottle')&&Number.isFinite(r.end)&&r.end<=now()).sort((a,b)=>b.end-a.end)[0]||null}

function sleepTimeline(){const end=now(),start=end-86400000;let intervals=state.records.filter(r=>r.type==='sleep'&&r.end>start&&r.start<end).map(r=>({a:Math.max(start,r.start),b:Math.min(end,r.end)}));if(state.sleep)intervals.push({a:Math.max(start,state.sleep.start),b:end});intervals=intervals.filter(x=>x.b>x.a).sort((a,b)=>a.a-b.a);let merged=[];for(const x of intervals){let last=merged[merged.length-1];if(last&&x.a<=last.b)last.b=Math.max(last.b,x.b);else merged.push({...x})}let cursor=start,parts=[];for(const x of merged){if(x.a>cursor)parts.push({a:cursor,b:x.a,sleep:false});parts.push({a:x.a,b:x.b,sleep:true});cursor=x.b}if(cursor<end)parts.push({a:cursor,b:end,sleep:false});return '<div class="card"><h2>🌙 Son i vigília · 24 hores</h2><svg viewBox="0 0 600 36" style="width:100%;height:36px;display:block" role="img" aria-label="Blau dormint, groc despert"><defs><clipPath id="sleepBarClip"><rect x="0" y="0" width="600" height="36" rx="10"/></clipPath></defs><g clip-path="url(#sleepBarClip)">'+parts.map(p=>'<rect x="'+((p.a-start)/86400000*600)+'" y="0" width="'+((p.b-p.a)/86400000*600+.15)+'" height="36" fill="'+(p.sleep?'#6489e9':'#f0bd55')+'"><title>'+fmt(p.a)+'–'+fmt(p.b)+'</title></rect>').join('')+'</g></svg><div style="display:flex;justify-content:space-between;margin:5px 0"><small>Fa 24 h</small><small>Fa 12 h</small><small>Ara</small></div><small><span style="color:#6489e9">●</span> Dormint · <span style="color:#f0bd55">●</span> Despert (estimació entre registres de son)</small></div>'}
let historyMode='24h';function setHistoryMode(mode){historyMode=mode;renderHistory()}
function weekStart(t){let d=new Date(t),day=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,weekday:'short'}).format(d);let offset=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].indexOf(day);let k=dateKey(t);return new Date(k+'T12:00:00').getTime()-Math.max(0,offset)*86400000}
function weekOverview(){let monday=weekStart(now());let keys=Array.from({length:7},(_,i)=>dateKey(monday+i*86400000));let labels=['Dl','Dt','Dc','Dj','Dv','Ds','Dg'];let rows=keys.map((key,i)=>{let dayStart=fromInput(key+'T00:00'),dayEnd=fromInput(dateKey(dayStart+36*3600000)+'T00:00');let sleeps=state.records.filter(r=>r.type==='sleep'&&r.end>dayStart&&r.start<dayEnd);let sleepMs=sleeps.reduce((n,r)=>n+Math.max(0,Math.min(dayEnd,r.end)-Math.max(dayStart,r.start)),0);if(state.sleep&&state.sleep.start<dayEnd)sleepMs+=Math.max(0,Math.min(now(),dayEnd)-Math.max(dayStart,state.sleep.start));let feeds=state.records.filter(r=>(r.type==='breast'||r.type==='bottle')&&dateKey(r.start)===key);let diapers=state.records.filter(r=>r.type==='diaper'&&dateKey(r.start)===key);let ml=feeds.filter(r=>r.type==='bottle').reduce((n,r)=>n+Number(r.amount||0),0);return {key,label:labels[i],sleepMs,feeds,diapers,ml}});let max=Math.max(1,...rows.map(r=>r.sleepMs));return '<div class="card"><h2>📅 Resum setmanal</h2><small>Setmana de '+keys[0]+' a '+keys[6]+'</small><h3>🌙 Hores de son per dia</h3>'+rows.map(r=>'<div style="display:flex;align-items:center;gap:8px;margin:9px 0"><span style="width:24px">'+r.label+'</span><div style="flex:1;background:#e8edf6;border-radius:7px;overflow:hidden;height:15px"><div style="height:100%;width:'+(r.sleepMs/max*100)+'%;background:#6489e9"></div></div><small style="min-width:50px;text-align:right">'+duration(r.sleepMs)+'</small></div>').join('')+'<h3>🍼 Preses i bolquers</h3><div style="overflow-x:auto"><table style="width:100%;font-size:13px;text-align:center"><thead><tr><th>Dia</th><th>Pit</th><th>Biberons</th><th>ml</th><th>Bolquers</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+r.label+'</td><td>'+r.feeds.filter(x=>x.type==='breast').length+'</td><td>'+r.feeds.filter(x=>x.type==='bottle').length+'</td><td>'+r.ml+'</td><td>'+r.diapers.length+'</td></tr>').join('')+'</tbody></table></div><small>Les dades es calculen a partir dels registres guardats; els dies futurs apareixen buits.</small></div>'}
function renderDailySummary(){let cutoff=now()-86400000,end=now(),s=recentEntries('sleep'),b=recentEntries('bottle'),p=recentEntries('breast'),d=recentEntries('diaper');let sleepMs=s.reduce((n,r)=>n+Math.max(0,Math.min(r.end,end)-Math.max(r.start,cutoff)),0);if(state.sleep)sleepMs+=Math.max(0,end-Math.max(state.sleep.start,cutoff));let breastMs=p.reduce((n,r)=>n+Math.max(0,(r.segments||[]).length?r.segments.filter(s=>s.side!=='pause').reduce((a,s)=>a+Math.max(0,s.durationMs??s.end-s.start),0):(Number.isFinite(r.activeDurationMs)?r.activeDurationMs:r.end-r.start)),0);if(state.breast)breastMs+=breastElapsed(state.breast);let awake=awakeWindows();let tiles=[['☀️ Despert',duration(awake.total),'entre migdiades · últimes 24 h'],['🌙 Son',s.length+(state.sleep?1:0)+' / '+duration(sleepMs),'episodis / temps total'],['🍼 Biberons',b.length+' / '+b.reduce((n,r)=>n+Number(r.amount||0),0)+' ml','preses / volum total'],['🤱 Pit',p.length+(state.breast?1:0)+' / '+duration(breastMs),'preses / temps total'],['🧷 Bolquers',d.length+' canvis',d.filter(r=>r.pee).length+' pipís · '+d.filter(r=>r.poop).length+' caques'],['🕒 Última presa',feedSince(),(()=>{let r=lastFeed();return r?(r.type==='breast'?'🤱 Pit':'🍼 Biberó')+' · acabada a les '+fmt(r.end):'Encara no hi ha preses acabades'})()]];$('dailySummary').innerHTML='<h2>📊 Resum de les últimes 24 hores</h2><div class="summary-grid">'+tiles.map(([label,value,detail],i)=>'<div class="summary-tile" data-kind="'+['awake','sleep','bottle','breast','diaper','last-feed'][i]+'"><div class="summary-label">'+label+'</div><strong>'+value+'</strong><small>'+detail+'</small></div>').join('')+'</div>'}

function entryCard(r){let icon=r.type==='sleep'?'🌙':r.type==='bottle'?'🍼':r.type==='breast'?'🤱':'🧷',main='',extra='';if(r.type==='sleep'){main=fmt(r.start)+'–'+fmt(r.end)+' · '+duration(r.end-r.start);extra=[r.sleepPlace?'💤 '+r.sleepPlace:'',r.wakeReasons?.length?'☀️ '+r.wakeReasons.join(', '):''].filter(Boolean).join(' · ')}else if(r.type==='bottle'){main=fmt(r.start)+'–'+fmt(r.end)+' · '+r.amount+' ml'}else if(r.type==='breast'){main=fmt(r.start)+'–'+fmt(r.end)+' · '+duration((r.segments||[]).length?(r.segments||[]).filter(s=>s.side!=='pause').reduce((n,s)=>n+Math.max(0,s.durationMs??s.end-s.start),0):(Number.isFinite(r.activeDurationMs)?r.activeDurationMs:r.end-r.start));extra=(r.segments||[]).map(s=>(s.side==='pause'?'⏸ Descans':s.side==='left'?'Esq.':'Dret')+' '+duration(Math.max(0,s.durationMs??s.end-s.start))).join(' · ')}else{main=fmt(r.start)+' · '+[r.pee?'Pipí '+r.pee:'',r.poop?'Caca '+r.poop:''].filter(Boolean).join(' + ')}return '<div class="entry"><div class="entry-main"><span class="entry-icon">'+icon+'</span><div class="entry-info"><div class="entry-primary">'+main+'</div>'+(extra?'<div class="entry-secondary">'+extra+'</div>':'')+'</div></div><div class="entry-actions"><button onclick="editRecord(\''+r.id+'\')">Editar</button><button aria-label="Eliminar registre" onclick="del(\''+r.id+'\')">✕</button></div></div>'}

function renderSleep(){let s=state.sleep;let awake=awakeWindows();let awakeInfo='<div class="card"><h2>☀️ Temps despert</h2>'+(awake.current?'<div class="pill">Despert ara: '+duration(awake.current.ms)+' · des de les '+fmt(awake.current.start)+'</div>':s?'<div class="pill">💤 Ara està dormint</div>':'<p class="muted">Encara no hi ha un despertar registrat.</p>')+'<p><strong>Finestres de vigília registrades</strong></p>'+(awake.gaps.length?awake.gaps.slice(-8).reverse().map(g=>'<p>☀️ '+fmt(g.start)+'–'+fmt(g.end)+' · <strong>'+duration(g.ms)+'</strong></p>').join(''):'<p class="muted">Encara no hi ha dues migdiades per calcular intervals.</p>')+'<small>Calculat entre episodis de son registrats, dins les últimes 24 hores.</small></div>';$('sleep').innerHTML=`<div class="card"><h2>🌙 Son</h2>${s?`<div class="pill">💤 El Jan està dormint</div><div id="timer" class="big" role="timer" aria-label="Temps dormint">${clockDuration(sleepElapsed(s))}</div><div class="row"><button class="primary" onclick="toggleSleep()">${s.paused?'▶ Reprendre':'⏸ Pausar'}</button></div><small>⏱️ Hores : minuts : segons · en directe</small><label>S’ha adormit a les</label>${input('sleepStart',s.start)}<p><button onclick="updateSleepStart()">Actualitzar inici</button></p><label>Hora de despertar</label>${input('sleepEnd',now())}<p><button class="primary" onclick="finishSleepNow()">☀️ El Jan s’ha despertat</button></p><div id="wakeForm" class="hidden"><label>Per què s’ha despertat? (pots marcar diverses opcions)</label>${['Gana / lactància','Canvi de bolquer','Molèsties / gasos','Soroll / estímul extern','Desconegut','Altres'].map((x,i)=>`<label style="font-weight:400"><input style="width:auto" type="checkbox" name="wakeReason" value="${x}"> ${x}</label>`).join('')}<label>On o com s’ha adormit?</label><select id="sleepPlace"><option value="">Sense especificar</option>${['Bressol','En braços','Menjant (pit)','Menjant (biberó)','Cotxet','Cotxe','Altres'].map(x=>`<option>${x}</option>`).join('')}</selec function startSleep(){state.sleep={start:fromInput($('sleepStart').value),elapsed:0,paused:false};save();render()}function updateSleepStart(){let s=state.sleep;s.start=fromInput($('sleepStart').value);s.elapsed=0;s.resumedAt=s.start;save();render()}function toggleSleep(){let s=state.sleep;if(s.paused){s.paused=false;s.resumedAt=now()}else{s.elapsed=sleepElapsed(s);s.paused=true}save();render()}function finishSleepNow(){let s=state.sleep;if(!s)return;let field=$('sleepEnd'),end=field?fromInput(field.value):now();if(!Number.isFinite(end)||end<s.start)return alert('Revisa l’hora de despertar');add({type:'sleep',start:s.start,end,wakeReasons:[],sleepPlace:''});state.sleep=null;save();render()}
function showWakeForm(){let s=state.sleep;if(!s)return;let t=now();if(!s.paused){s.elapsed=sleepElapsed(s);s.paused=true;s.wakePending=true;save()}let endInput=$('sleepEnd');if(endInput)endInput.value=localInput(t);let timer=$('timer');if(timer)timer.textContent=clockDuration(sleepElapsed(s));let form=$('wakeForm');if(form)form.classList.remove('hidden');let status=document.getElementById('wakeStoppedNotice');if(!status&&form){status=document.createElement('p');status.id='wakeStoppedNotice';status.className='pill';status.textContent='☀️ Cronòmetre aturat. Indica el motiu i guarda el despertar.';form.prepend(status)}}function endSleep(){let reasons=[...document.querySelectorAll('input[name="wakeReason"]:checked')].map(x=>x.value),place=$('sleepPlace').value;let end=fromInput($('sleepEnd').value);if(end<state.sleep.start)return alert('El despertar no pot ser anterior a l’inici');add({type:'sleep',start:state.sleep.start,end,wakeReasons:reasons,sleepPlace:place});state.sleep=null;save();let diaper=(reasons.includes('Canvi de bolquer')||reasons.includes('Cambio de pañal')),feed=(reasons.includes('Gana / lactància')||reasons.includes('Hambre / lactancia'));if(diaper){activeTab='diaper';wet=false;dirty=false}else if(feed){activeTab='feed';feedType='breast'}render()}
function renderFeed(){let b=state.breast;$('feed').innerHTML=`<div class="card"><h2>🍼 Lactància</h2>${b?`<div class="pill">🤱 Presa de pit en curs: ${b.side==='left'?'esquerre':'dret'}</div><p style="margin-bottom:4px">⏱️ Temps total de lactància</p><div class="big" id="breasttimer">00:00:00</div><p style="margin-bottom:4px">⏱️ Temps del pit actual</p><div class="big" id="sidetimer">00:00:00</div><div class="row"><button class="primary" onclick="toggleBreast()">${b.paused?'▶ Reprendre':'⏸ Pausar'}</button></div><label>Inici de la presa</label>${input('breastStart',b.start)}<p><button onclick="updateBreastStart()">Corregir inici</button></p><div class="row"><button onclick="switchBreast()">⇄ Canviar de pit</button><button class="primary" onclick="endBreast()">Finalitzar presa</button></div><label>Hora de finalització (editable)</label>${input('breastEnd',now())}<p><small>En canviar de pit es desa la durada de cada costat.</small></p>`:`<div class="row"><button class="${feedType==='bottle'?'selected':''}" onclick="feedType='bottle';render()">🍼 Biberón</button><button class="${feedType==='breast'?'selected':''}" onclick="feedType='breast';render()">🤱 Pit</button></div>${feedType==='bottle'?`<label>Quantitat (ml)</label><input id="amount" type="number" min="0" step="1" placeholder="Ex. 60"><label>Inicio</label>${input('bottleStart',now())}<label>Final</label>${input('bottleEnd',now())}<p><button class="primary" onclick="addBottle()">Guardar biberó</button></p>`:`<label>Inicio</label>${input('breastStart',now())}<label>Primer pit</label><div class="row"><button onclick="startBreast('left')">Esquerre</button><button onclick="startBreast('right')">Dret</button></div>`}`}</div><div class="card"><h2>Preses de les últimes 24 hores</h2>${[...recentEntries('bottle'),...recentEntries('breast')].sort((a,b)=>b.start-a.start).map(entryCard).join('')||'<p class="muted">Encara no hi ha preses.</p>'}</div>`}
function addBottle(){let amount=Number($('amount').value),start=fromInput($('bottleStart').value),end=fromInput($('bottleEnd').value);if(!(amount>0)||end<start)return alert('Revisa la quantitat i els horaris');add({type:'bottle',amount,start,end})}function startBreast(side){let start=fromInput($('breastStart').value);state.breast={start,side,segmentStart:start,segments:[],elapsed:0,sideElapsed:0,paused:false};save();render()}function updateBreastStart(){let b=state.breast,n=fromInput($('breastStart').value);if(b.segments.length)return alert('Per corregir una presa amb canvis de pit, finalitza-la i edita-la a l’historial.');b.start=n;b.segmentStart=n;b.resumedAt=n;b.sideResumedAt=n;b.elapsed=0;b.sideElapsed=0;save();render()}function toggleBreast(){let b=state.breast;if(b.paused){b.paused=false;b.resumedAt=now();b.sideResumedAt=now()}else{b.elapsed=breastElapsed(b);b.sideElapsed=breastSideElapsed(b);b.paused=true}save();render()}function switchBreast(){let b=state.breast,t=now();b.segments.push({side:b.side,start:b.segmentStart,end:t,durationMs:breastSideElapsed(b)});b.elapsed=breastElapsed(b);b.resumedAt=t;b.side=b.side==='left'?'right':'left';b.segmentStart=t;b.sideElapsed=0;b.sideResumedAt=t;save();render()}function endBreast(){let b=state.breast,t=fromInput($('breastEnd').value);if(t<b.start||t<b.segmentStart)return alert('L’hora final no pot ser anterior a l’inici o al darrer canvi de pit');let segments=[...b.segments,{side:b.side,start:b.segmentStart,end:t,durationMs:Math.max(0,breastSideElapsed(b)+(t-now()))}];add({type:'breast',start:b.start,end:t,segments,activeDurationMs:Math.max(0,breastElapsed(b)+(t-now()))});state.breast=null;save();render()}
function levelButtons(kind,selected){return `<div class="levels">${['1','1.5','2','2.5','3','3+'].map(x=>`<button class="${selected===x?'selected':''}" onclick="${kind==='pee'?`peeLevel='${x}'`:`poopLevel='${x}'`};renderDiaper()">${x}</button>`).join('')}</div>`}function renderDiaper(){$('diaper').innerHTML=`<div class="card"><h2>🧷 Canvi de bolquer</h2><div class="row"><button class="${wet?'selected':''}" onclick="wet=!wet;renderDiaper()">💧 Pipí ${wet?'✓':''}</button><button class="${dirty?'selected':''}" onclick="dirty=!dirty;renderDiaper()">💩 Caca ${dirty?'✓':''}</button></div>${wet?`<label>Quantitat de pipí</label>${levelButtons('pee',peeLevel)}`:''}${dirty?`<label>Quantitat de caca</label>${levelButtons('poop',poopLevel)}`:''}<label>Hora del canvi</label>${input('diaperTime',now())}<p><button class="primary" onclick="addDiaper()">Guardar bolquer</button></p></div><div class="card"><h2>Bolquers de les últimes 24 hores</h2>${recentList('diaper')}</div>`}function addDiaper(){if(!wet&&!dirty)return alert('Marca pipí, caca o totes dues');add({type:'diaper',start:fromInput($('diaperTime').value),pee:wet?peeLevel:null,poop:dirty?poopLevel:null});wet=false;dirty=false;render()}
function growthChart(rows,key,color,unit){let points=rows.filter(r=>Number.isFinite(Number(r[key]))&&r[key]!==null&&r[key]!==undefined&&r[key]!=='').sort((a,b)=>a.start-b.start);if(!points.length)return '<p class="muted">Encara no hi ha mesures.</p>';let values=points.map(r=>Number(r[key]));if(points.length===1)return '<div style="text-align:center;padding:20px 0"><strong style="font-size:30px">'+values[0]+' '+unit+'</strong><p class="muted">Mesura del '+dateKey(points[0].start)+'</p><small>Amb dues mesures apareixerà el gràfic d’evolució.</small></div>';let min=Math.min(...values),max=Math.max(...values),margin=Math.max((max-min)*.2,key==='weight'?25:.5);let lo=Math.max(0,min-margin),hi=max+margin;let x0=52,x1=300,y0=15,y1=126;let coords=points.map((r,i)=>[x0+(r.start-points[0].start)/Math.max(1,points[points.length-1].start-points[0].start)*(x1-x0),y1-(Number(r[key])-lo)/(hi-lo)*(y1-y0)]);let yTicks=[0,1,2,3].map(i=>{let y=y1-i*(y1-y0)/3,v=lo+(hi-lo)*i/3;return '<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="#8793a5" stroke-opacity=".25"/><text x="45" y="'+(y+4)+'" font-size="11" text-anchor="end" fill="currentColor">'+(key==='weight'?Math.round(v):v.toFixed(1))+'</text>'}).join('');let dates=[0,points.length-1].map((i,j)=>'<text x="'+(j?x1:x0)+'" y="150" font-size="11" text-anchor="'+(j?'end':'start')+'" fill="currentColor">'+dateKey(points[i].start).slice(5)+'</text>').join('');let delta=values[values.length-1]-values[0];return '<svg viewBox="0 0 330 165" role="img" aria-label="Evolució de '+key+'" style="width:100%;max-height:230px;overflow:visible;color:inherit"><text x="5" y="10" font-size="10" fill="currentColor">'+unit+'</text>'+yTicks+'<line x1="'+x0+'" y1="'+y1+'" x2="'+x1+'" y2="'+y1+'" stroke="#8793a5"/><polyline points="'+coords.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="'+color+'" stroke-width="3"/>'+coords.map((p,i)=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="'+color+'"><title>'+dateKey(points[i].start)+': '+values[i]+' ' function renderGrowth(){let records=state.records.filter(r=>r.type==='growth').sort((a,b)=>b.start-a.start);$('growth').innerHTML='<div class="card"><h2>📏 Creixement del Jan</h2><p><small>Introdueix només les mesures que tinguis. No cal pesar-lo cada dia.</small></p><label>Data i hora</label>'+input('growthTime',now())+'<label>Pes (g)</label><input id="growthWeight" type="number" min="1" step="1" placeholder="Ex. 2720"><label>Talla (cm)</label><input id="growthHeight" type="number" min="1" step="0.1" placeholder="Ex. 49,5"><label>Perímetre cranial (cm)</label><input id="growthHead" type="number" min="1" step="0.1" placeholder="Ex. 34"><p><button class="primary" onclick="addGrowth()">Guardar mesures</button></p></div>'+[['weight','⚖️ Pes','#6489e9','g'],['height','📏 Talla','#23a789','cm'],['head','🧠 Perímetre cranial','#d68d34','cm']].map(([key,title,color,unit])=>'<div class="card"><h2>'+title+'</h2>'+growthChart(records,key,color,unit)+'</div>').join('')+'<div class="card"><h2>Historial de mesures</h2>'+(records.map(r=>'<div class="pill">'+dateKey(r.start)+' · '+[r.weight!=null?r.weight+' g':'',r.height!=null?r.height+' cm':'',r.head!=null?'PC '+r.head+' cm':''].filter(Boolean).join(' · ')+'<div class="row"><button onclick="editGrowth(\''+r.id+'\')">Editar</button><button onclick="deleteGrowth(\''+r.id+'\')">Eliminar</button></div></div>').join('')||'<p class="muted">Sense registres.</p>')+'</div><p class="muted">Les gràfiques mostren mesures registrades, no percentils. La interpretació del creixement en prematurs correspon a pediatria.</p>'}

function recentEntries(type){let cutoff=now()-86400000;return state.records.filter(r=>r.type===type&&(r.end??r.start)>=cutoff&&r.start<=now())}function recentList(type){let a=recentEntries(type).sort((a,b)=>b.start-a.start);return a.map(entryCard).join('')||'<p class="muted">Sense registres en les últimes 24 hores.</p>'}function summary24(){let cutoff=now()-86400000,s=recentEntries('sleep'),b=recentEntries('bottle'),p=recentEntries('breast'),d=recentEntries('diaper');let sleepMs=s.reduce((a,r)=>a+Math.max(0,Math.min(r.end,now())-Math.max(r.start,cutoff)),0);if(state.sleep)sleepMs+=Math.max(0,now()-Math.max(state.sleep.start,cutoff));return `<div class="pill">🌙 ${s.length} episodis de son completats · ${duration(sleepMs)}<br>🍼 ${b.length} biberons · ${b.reduce((a,r)=>a+r.amount,0)} ml<br>🤱 ${p.length} preses de pit<br>🧷 ${d.length} bolquers · ${d.filter(r=>r.pee).length} pipí · ${d.filter(r=>r.poop).length} caca</div>`}function summary(day){let s=entries('sleep',day),b=entries('bottle',day),p=entries('breast',day),d=entries('diaper',day);return `<div class="pill">🌙 ${s.length} episodis de son · ${duration(s.reduce((a,r)=>a+r.end-r.start,0))}<br>🍼 ${b.length} biberons · ${b.reduce((a,r)=>a+r.amount,0)} ml<br>🤱 ${p.length} preses de pit · ${duration(p.reduce((a,r)=>a+r.end-r.start,0))}<br>🧷 ${d.length} bolquers · ${d.filter(r=>r.pee).length} pipí · ${d.filter(r=>r.poop).length} caca</div>`}function dayDetails(day){return `${state.archived.includes(day)?'<p>📁 Dia arxivat</p>':''}${summary(day)}${['sleep','bottle','breast','diaper'].map(t=>list(t,day)).join('')}`}function showHistoryDay(){$('historyResult').innerHTML=dayDetails($('historyDay').value)}function archiveToday(){let d=dateKey(now());if(!state.archived.includes(d))state.archived.push(d);save();render();alert('Dia arxivat. Puedes seguir consultándolo y editarlo.')}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`jan-tracker-${dateKey(now())}.json`;a.click();URL.revokeObjectURL(url)}async function importData(el){try{let data=JSON.parse(await el.files[0].text());if(!Array.isArray(data.records))throw Error('Format incorrecte');if(!confirm('Vols substituir totes les dades actuals per la còpia?'))return;state={records:data.records,sleep:data.sleep||null,breast:data.breast||null,archived:data.archived||[]};save();render()}catch(e){alert('No s’ha pogut importar: '+e.message)}}
function editBreastRecord(id){const r=state.records.find(x=>x.id===id&&x.type==='breast');if(!r)return;const segs=(r.segments?.length?r.segments:[{side:'left',start:r.start,end:r.end}]).map(s=>({...s}));let overlay=document.createElement('div');overlay.id='breastEditor';overlay.style.cssText='position:fixed;inset:0;z-index:9999;background:#12213b99;display:flex;align-items:center;justify-content:center;padding:12px';overlay.innerHTML='<div style="background:white;color:#26354b;border-radius:18px;padding:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto"><h2>🤱 Editar lactància</h2><p><small>Modifica els trams de pit i afegeix pauses per fer el rotet o canviar el bolquer. Les pauses no compten com a lactància activa.</small></p><div id="breastEditRows"></div><div class="row"><button type="button" id="addBreastLeft">+ Esquerra</button><button type="button" id="addBreastRight">+ Dreta</button><button type="button" id="addBreastPause">+ Pausa</button></div><p id="breastEditError" style="color:#bd283c"></p><div class="row"><button type="button" id="cancelBreastEdit">Cancel·lar</button><button class="primary" type="button" id="saveBreastEdit">Guardar canvis</button></div></div>';document.body.appendChild(overlay);const rows=overlay.querySelector('#breastEditRows');function readRows(){return [...rows.querySelectorAll('[data-segment]')].map(el=>({side:el.querySelector('select').value,start:fromInput(el.querySelector('[data-start]').value),end:fromInput(el.querySelector('[data-end]').value)}))}function draw(items){rows.innerHTML=items.map((s,i)=>'<div data-segment style="border:1px solid #dbe3f0;border-radius:12px;padding:10px;margin:8px 0"><div class="row"><strong>Tram '+(i+1)+'</strong><button type="button" data-remove="'+i+'">✕</button></div><label>Tipus</label><select><option value="left" '+(s.side==='left'?'selected':'')+'>Pit esquerre</option><option value="right" '+(s.side==='right'?'selected':'')+'>Pit dret</option><option value="pause" '+(s.side==='pause'?'selected':'')+'>⏸ Pausa (rotet, bolquer...)</option></select><label>Inici</label><input data-start type="datetime-local" value="'+localInput(s.start)+'"><label>Final</label><input data-end type="datetime-local" value="'+localInput(s.end)+'"></div>').join('');rows.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let a=readRows();a.splice(Number(b.dataset.remove),1);draw(a)})}draw(segs);for(const [id,side] of [['addBreastLeft','left'],['addBreastRight','right'],['addBreastPause','pause']])overlay.querySelector('#'+id).onclick=()=>{let a=readRows(),start=a.length?a[a.length-1].end:r.start;draw([...a,{side,start,end:start+60000}]);rows.lastElementChild?.scrollIntoView({block:'nearest'})};overlay.querySelector('#cancelBreastEdit').onclick=()=>overlay.remove();overlay.onclick=e=>{if(e.target===overlay)overlay.remove()};overlay.querySelector('#saveBreastEdit').onclick=()=>{let a=readRows();let err=overlay.querySelector('#breastEditError');if(!a.length||a.some(s=>!Number.isFinite(s.start)||!Number.isFinite(s.end)||s.end<=s.start)){err.textContent='Revisa les hores: cada tram ha de tenir inici i final vàlids.';return}a.sort((x,y)=>x.start-y.start);if(a.some((s,i)=>i>0&&s.start<a[i-1].end)){err.textContent='Hi ha trams que se solapen. Corregeix els horaris.';return}if(!a.some(s=>s.side!=='pause')){err.textContent='Cal almenys un tram de lactància.';return}r.start=a[0].start;r.end=a[a.length-1].end;r.segments=a.map(s=>({...s,durationMs:s.end-s.start}));r.activeDurationMs=a.filter(s=>s.side!=='pause').reduce((n,s)=>n+s.durationMs,0);save();overlay.remove();render()}}
function editRecord(id){let r=state.records.find(x=>x.id===id);if(!r)return;if(r.type==='breast')return editBreastRecord(id);let s=prompt('Inici (AAAA-MM-DDTHH:MM)',localInput(r.start));if(s===null)return;let start=fromInput(s),end=r.end;if(r.end!==undefined){let e=prompt('Final (AAAA-MM-DDTHH:MM)',localInput(r.end));if(e===null)return;end=fromInput(e);if(end<start)return alert('L’hora final ha de ser posterior a la inicial')}if(r.type==='sleep'){let place=prompt('On o com s’ha adormit',r.sleepPlace||'');if(place===null)return;let reasons=prompt('Motius del despertar (separats per comes)',(r.wakeReasons||[]).join(', '));if(reasons===null)return;r.sleepPlace=place.trim();r.wakeReasons=reasons.split(',').map(x=>x.trim()).filter(Boolean)}if(r.type==='bottle'){let a=prompt('Quantitat en ml',r.amount);if(a===null)return;if(!(Number(a)>0))return alert('Quantitat no vàlida');r.amount=Number(a)}if(r.type==='diaper'){let p=prompt('Pipí (buit, 1, 1.5, 2, 2.5, 3, 3+)',r.pee||'');if(p===null)return;let c=prompt('Caca (buit, 1, 1.5, 2, 2.5, 3, 3+)',r.poop||'');if(c===null)return;let allowed=['','1','1.5','2','2.5','3','3+'];if(!allowed.includes(p)||!allowed.includes(c)||(!p&&!c))return alert('Nivells no vàlids');r.pee=p||null;r.poop=c||null}if(r.type==='breast'){let old=r.end-r.start;let shift=start-r.start;r.segments=r.segments.map(seg=>({...seg,start:seg.start+shift,end:seg.end+shift}));if(r.segments.length){r.segments[r.segments.length-1].end+=end-start-old;if(r.segments.some(seg=>seg.end<seg.start))return alert('Durada no vàlida per a un tram')}}r.start=start;if(r.end!==undefined)r.end=end;save();render()}
