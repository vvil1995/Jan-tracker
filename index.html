<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jan Tracker</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#233044;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:18px 16px 80px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:27px;margin:8px 0}h2{font-size:19px}small,.muted{color:#66758b}.clock{font-weight:750;font-size:21px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:20px 0}.tabs button{padding:12px 3px;font-size:12px}.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #20304b0c}.primary{background:#4269e8;color:white}.danger{background:#d94f5e;color:white}button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:#e9eef9;color:#263b69}button:disabled{opacity:.4}input,select{padding:11px;border:1px solid #d9e0eb;border-radius:10px;font:inherit;max-width:100%;width:100%;background:white}label{display:block;margin:12px 0 5px;font-weight:600;font-size:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.big{font-size:30px;font-weight:800;margin:10px 0}.hidden{display:none}.entry{border-top:1px solid #edf0f5;padding:12px 0}.entry:first-child{border:0}.entry button{font-size:12px;padding:7px 10px}.pill{background:#edf2ff;border-radius:12px;padding:10px;margin:10px 0}.levels{display:flex;gap:5px;flex-wrap:wrap}.levels button{flex:1;padding:10px 4px}.selected{background:#4269e8;color:white}footer{font-size:12px;color:#66758b;text-align:center;margin-top:25px} .daily-summary{background:linear-gradient(135deg,#e5f0ff,#fff);border:1px solid #cbdfff;border-radius:18px;padding:14px;margin:14px 0 8px;box-shadow:0 3px 14px #20304b0c}.daily-summary h2{margin:0 0 12px;font-size:17px}.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.summary-tile{background:#fff;border-radius:13px;padding:12px 10px;min-width:0}.summary-tile .summary-label{font-size:13px;color:#53637b;margin-bottom:5px}.summary-tile strong{display:block;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}.summary-tile small{display:block;margin-top:5px;font-size:11px} .entry .entry-main{min-width:0;width:100%;display:flex;align-items:center;gap:8px;flex-wrap:nowrap}.entry .entry-icon{flex:none;font-size:19px}.entry .entry-info{min-width:0;flex:1}.entry .entry-primary{font-size:14px;font-weight:650;white-space:nowrap;letter-spacing:-.3px}.entry .entry-secondary{font-size:12px;color:#8895a9;overflow-wrap:anywhere;margin-top:4px}.entry .entry-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:9px}.entry .entry-actions button{flex:none;padding:7px 14px;min-width:75px}.entry .entry-actions button:last-child{min-width:42px}  .hero-header{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(120deg,#142e60,#173f82 62%,#101d3d);border:1px solid #416ba6;border-radius:20px;padding:13px 14px;margin-bottom:12px;min-height:112px;color:#fff;overflow:hidden}.hero-brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}.hero-art{width:82px;height:82px;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 60% 40%,#315db2,#102a5e);border-radius:17px;position:relative}.hero-art .moon{font-size:40px}.hero-art .stars{position:absolute;top:6px;right:7px;color:#ffd76a;font-size:16px}.hero-title{font-weight:900;font-size:clamp(18px,5vw,27px);line-height:1.05;color:white}.hero-sub{font-size:11px;color:#bcd5ff;margin-top:6px}.hero-clock{background:#10234b;border:1px solid #5478af;border-radius:14px;padding:12px 9px;text-align:center;flex:none;min-width:96px}.hero-clock .clock{font-size:clamp(19px,5vw,26px);color:white}.hero-clock small{color:#bcd5ff;font-size:12px}.hero-header .hero-logo{width:104px;height:104px;max-width:100%;object-fit:contain;display:none;border-radius:18px;image-rendering:auto}.hero-header.has-logo .hero-brand{flex:1;min-width:0}.hero-header.has-logo{min-height:128px}.hero-header.has-logo .hero-logo{display:block}.hero-header.has-logo .hero-logo{display:block}.hero-header.has-logo .hero-art,.hero-header.has-logo .hero-wordmark{display:none}@media(max-width:390px){.hero-art{width:65px;height:70px}.hero-clock{min-width:87px;padding:9px 6px}.hero-header{padding:10px;gap:8px}} </style></head><body><main><header class="hero-header" id="heroHeader"><div class="hero-brand"><img class="hero-logo" src="./jan-tracker-logo.png?v=2" alt="Jan Tracker — Jan i Hulk dormint" onload="document.getElementById('heroHeader').classList.add('has-logo')" onerror="this.style.display='none'"><div class="hero-art" aria-hidden="true"><span class="moon">🌙</span><span class="stars">✦ ✨</span></div><div class="hero-wordmark"><div class="hero-title">Jan<br>Tracker</div><div class="hero-sub">El diari del nostre petit</div></div></div><div class="hero-clock"><div class="clock" id="clock"></div><small>📍 Barcelona</small></div></header><div id="today"></div><section id="dailySummary" class="daily-summary" aria-label="Resumen de las últimas 24 horas"></section><nav class="tabs"><button onclick="tab('sleep')">🌙 Sueño</button><button onclick="tab('feed')">🍼 Tomas</button><button onclick="tab('diaper')">🧷 Pañales</button><button onclick="tab('history')">📅 Historial</button></nav><section id="sleep"></section><section id="feed" class="hidden"></section><section id="diaper" class="hidden"></section><section id="history" class="hidden"></section><footer>Datos guardados en este navegador. Exporta copias de seguridad periódicamente.</footer></main><script>
const TZ='Europe/Madrid',KEY='jan-tracker-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{records:[],sleep:null,breast:null,archived:[]}}catch{state={records:[],sleep:null,breast:null,archived:[]}};state.records ||= [];state.archived ||= [];let activeTab='sleep',feedType='bottle',wet=false,dirty=false,peeLevel='1',poopLevel='1';const $=id=>document.getElementById(id),now=()=>Date.now(),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),fmt=t=>new Intl.DateTimeFormat('es-ES',{timeZone:TZ,hour:'2-digit',minute:'2-digit'}).format(new Date(t)),dateKey=t=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(t)),duration=ms=>{let m=Math.max(0,Math.floor(ms/60000));return `${Math.floor(m/60)} h ${m%60} min`},localInput=t=>{const parts=new Intl.DateTimeFormat('sv-SE',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(t));return parts.replace(' ','T')},fromInput=v=>{if(!v)return now();let [d,tm]=v.split('T');let [y,m,day]=d.split('-').map(Number),[h,min]=tm.split(':').map(Number);let guess=Date.UTC(y,m-1,day,h,min);for(let i=0;i<3;i++){let shown=localInput(guess),[sd,st]=shown.split('T'),[sy,sm,sday]=sd.split('-').map(Number),[sh,smin]=st.split(':').map(Number);let offset=Date.UTC(sy,sm-1,sday,sh,smin)-Date.UTC(y,m-1,day,h,min);guess-=offset}return guess},input=(id,t)=>`<input id="${id}" type="datetime-local" value="${localInput(t)}">`,add=r=>{state.records.push({...r,id:crypto.randomUUID()});save();render()},del=id=>{if(confirm('¿Eliminar este registro?')){state.records=state.records.filter(r=>r.id!==id);save();render()}},tab=t=>{activeTab=t;render()};function tick(){$('clock').textContent=fmt(now());$('today').innerHTML=`<small>${new Intl.DateTimeFormat('es-ES',{timeZone:TZ,weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date())}</small>`;let timer=$('timer');if(timer&&state.sleep)timer.textContent=clockDuration(sleepElapsed(state.sleep));let bt=$('breasttimer');if(bt&&state.breast){let b=state.breast;bt.textContent=clockDuration(breastElapsed(b));let side=$('sidetimer');if(side)side.textContent=clockDuration(breastSideElapsed(b))}}const sleepElapsed=s=>(s.elapsed||0)+(s.paused?0:Math.max(0,now()-(s.resumedAt??s.start))),breastElapsed=b=>(b.elapsed||0)+(b.paused?0:Math.max(0,now()-(b.resumedAt??b.start))),breastSideElapsed=b=>(b.sideElapsed||0)+(b.paused?0:Math.max(0,now()-(b.sideResumedAt??b.segmentStart)));const clockDuration=ms=>{let seconds=Math.max(0,Math.floor(ms/1000));return [Math.floor(seconds/3600),Math.floor(seconds/60)%60,seconds%60].map(v=>String(v).padStart(2,'0')).join(':')};setInterval(tick,1000);setInterval(()=>{if($('dailySummary'))renderDailySummary()},30000);
function awakeWindows(){const t=now(),cut=t-86400000;const sleeps=state.records.filter(r=>r.type==='sleep'&&Number.isFinite(r.start)&&Number.isFinite(r.end)&&r.end>r.start).map(r=>({start:r.start,end:r.end}));if(state.sleep&&Number.isFinite(state.sleep.start))sleeps.push({start:state.sleep.start,end:t});sleeps.sort((a,b)=>a.start-b.start);const merged=[];for(const s of sleeps){const last=merged[merged.length-1];if(last&&s.start<=last.end)last.end=Math.max(last.end,s.end);else merged.push({...s})}const gaps=[];for(let i=1;i<merged.length;i++){let a=Math.max(merged[i-1].end,cut),b=Math.min(merged[i].start,t);if(b>a)gaps.push({start:a,end:b,ms:b-a})}const last=merged[merged.length-1];const current=!state.sleep&&last&&last.end<t?{start:Math.max(last.end,cut),end:t,ms:t-Math.max(last.end,cut)}:null;return {gaps,current,total:gaps.reduce((n,g)=>n+g.ms,0)+(current?.ms||0)}}
function renderDailySummary(){let cutoff=now()-86400000,end=now(),s=recentEntries('sleep'),b=recentEntries('bottle'),p=recentEntries('breast'),d=recentEntries('diaper');let sleepMs=s.reduce((n,r)=>n+Math.max(0,Math.min(r.end,end)-Math.max(r.start,cutoff)),0);if(state.sleep)sleepMs+=Math.max(0,end-Math.max(state.sleep.start,cutoff));let breastMs=p.reduce((n,r)=>n+Math.max(0,(r.segments||[]).length?r.segments.filter(s=>s.side!=='pause').reduce((a,s)=>a+Math.max(0,s.durationMs??s.end-s.start),0):(Number.isFinite(r.activeDurationMs)?r.activeDurationMs:r.end-r.start)),0);if(state.breast)breastMs+=breastElapsed(state.breast);let awake=awakeWindows();let tiles=[['☀️ Despert',duration(awake.total),'entre migdiades · últimes 24 h'],['🌙 Son',s.length+(state.sleep?1:0)+' / '+duration(sleepMs),'episodis / temps total'],['🍼 Biberons',b.length+' / '+b.reduce((n,r)=>n+Number(r.amount||0),0)+' ml','preses / volum total'],['🤱 Pit',p.length+(state.breast?1:0)+' / '+duration(breastMs),'preses / temps total'],['🧷 Bolquers',d.length+' canvis',d.filter(r=>r.pee).length+' pipís · '+d.filter(r=>r.poop).length+' caques']];$('dailySummary').innerHTML='<h2>📊 Resum de les últimes 24 hores</h2><div class="summary-grid">'+tiles.map(([label,value,detail])=>'<div class="summary-tile"><div class="summary-label">'+label+'</div><strong>'+value+'</strong><small>'+detail+'</small></div>').join('')+'</div>'}
function render(){renderDailySummary();for(let t of ['sleep','feed','diaper','history'])$(t).classList.toggle('hidden',t!==activeTab);renderSleep();renderFeed();renderDiaper();renderHistory();tick()}
function entries(type,day=dateKey(now())){return state.records.filter(r=>r.type===type&&dateKey(r.start)===day).sort((a,b)=>b.start-a.start)}
function list(type,day){let arr=entries(type,day);return arr.length?arr.map(entryCard).join(''):'<p class="muted">Todavía no hay registros.</p>'}
function entryCard(r){let icon=r.type==='sleep'?'🌙':r.type==='bottle'?'🍼':r.type==='breast'?'🤱':'🧷',main='',extra='';if(r.type==='sleep'){main=fmt(r.start)+'–'+fmt(r.end)+' · '+duration(r.end-r.start);extra=[r.sleepPlace?'💤 '+r.sleepPlace:'',r.wakeReasons?.length?'☀️ '+r.wakeReasons.join(', '):''].filter(Boolean).join(' · ')}else if(r.type==='bottle'){main=fmt(r.start)+'–'+fmt(r.end)+' · '+r.amount+' ml'}else if(r.type==='breast'){main=fmt(r.start)+'–'+fmt(r.end)+' · '+duration((r.segments||[]).length?(r.segments||[]).filter(s=>s.side!=='pause').reduce((n,s)=>n+Math.max(0,s.durationMs??s.end-s.start),0):(Number.isFinite(r.activeDurationMs)?r.activeDurationMs:r.end-r.start));extra=(r.segments||[]).map(s=>(s.side==='pause'?'⏸ Descans':s.side==='left'?'Izq.':'Der.')+' '+duration(Math.max(0,s.durationMs??s.end-s.start))).join(' · ')}else{main=fmt(r.start)+' · '+[r.pee?'Pipí '+r.pee:'',r.poop?'Caca '+r.poop:''].filter(Boolean).join(' + ')}return '<div class="entry"><div class="entry-main"><span class="entry-icon">'+icon+'</span><div class="entry-info"><div class="entry-primary">'+main+'</div>'+(extra?'<div class="entry-secondary">'+extra+'</div>':'')+'</div></div><div class="entry-actions"><button onclick="editRecord(\''+r.id+'\')">Editar</button><button aria-label="Eliminar registro" onclick="del(\''+r.id+'\')">✕</button></div></div>'}
function describe(r){return entryCard(r)}
function renderSleep(){let s=state.sleep;let awake=awakeWindows();let awakeInfo='<div class="card"><h2>☀️ Temps despert</h2>'+(awake.current?'<div class="pill">Despert ara: '+duration(awake.current.ms)+' · des de les '+fmt(awake.current.start)+'</div>':s?'<div class="pill">💤 Ara està dormint</div>':'<p class="muted">Encara no hi ha un despertar registrat.</p>')+'<p><strong>Finestres de vigília registrades</strong></p>'+(awake.gaps.length?awake.gaps.slice(-8).reverse().map(g=>'<p>☀️ '+fmt(g.start)+'–'+fmt(g.end)+' · <strong>'+duration(g.ms)+'</strong></p>').join(''):'<p class="muted">Encara no hi ha dues migdiades per calcular intervals.</p>')+'<small>Calculat entre episodis de son registrats, dins les últimes 24 hores.</small></div>';$('sleep').innerHTML=`<div class="card"><h2>🌙 Sueño</h2>${s?`<div class="pill">💤 Jan está durmiendo</div><div id="timer" class="big" role="timer" aria-label="Tiempo durmiendo">${clockDuration(sleepElapsed(s))}</div><div class="row"><button class="primary" onclick="toggleSleep()">${s.paused?'▶ Reanudar':'⏸ Pausar'}</button></div><small>⏱️ Horas : minutos : segundos · en directo</small><label>Se durmió a las</label>${input('sleepStart',s.start)}<p><button onclick="updateSleepStart()">Actualizar inicio</button></p><label>Hora de despertar</label>${input('sleepEnd',now())}<p><button class="primary" onclick="showWakeForm()">☀️ Jan se ha despertado</button></p><div id="wakeForm" class="hidden"><label>¿Por qué se ha despertado? (puedes marcar varios)</label>${['Hambre / lactancia','Cambio de pañal','Molestias / gases','Ruido / estímulo externo','Desconocido','Otro'].map((x,i)=>`<label style="font-weight:400"><input style="width:auto" type="checkbox" name="wakeReason" value="${x}"> ${x}</label>`).join('')}<label>¿Dónde o cómo se durmió?</label><select id="sleepPlace"><option value="">Sin especificar</option>${['Cuna','En brazos','Comiendo (pecho)','Comiendo (biberón)','Cochecito','Coche','Otro'].map(x=>`<option>${x}</option>`).join('')}</select><p><button class="primary" onclick="endSleep()">Guardar despertar</button></p></div>`:`<p>¿Jan se acaba de dormir?</p><label>Hora de inicio (editable)</label>${input('sleepStart',now())}<p><button class="primary" onclick="startSleep()">💤 Se ha dormido</button></p>`}</div><div class="card"><h2>Sueño de las últimas 24 horas</h2>${recentList('sleep')}</div>${awakeInfo}`}
function startSleep(){state.sleep={start:fromInput($('sleepStart').value),elapsed:0,paused:false};save();render()}function updateSleepStart(){let s=state.sleep;s.start=fromInput($('sleepStart').value);s.elapsed=0;s.resumedAt=s.start;save();render()}function toggleSleep(){let s=state.sleep;if(s.paused){s.paused=false;s.resumedAt=now()}else{s.elapsed=sleepElapsed(s);s.paused=true}save();render()}function showWakeForm(){$('wakeForm').classList.remove('hidden')}function endSleep(){let reasons=[...document.querySelectorAll('input[name="wakeReason"]:checked')].map(x=>x.value),place=$('sleepPlace').value;let end=fromInput($('sleepEnd').value);if(end<state.sleep.start)return alert('El despertar no puede ser anterior al inicio');add({type:'sleep',start:state.sleep.start,end,wakeReasons:reasons,sleepPlace:place});state.sleep=null;save();let diaper=reasons.includes('Cambio de pañal'),feed=reasons.includes('Hambre / lactancia');if(diaper){activeTab='diaper';wet=false;dirty=false}else if(feed){activeTab='feed';feedType='breast'}render()}
function renderFeed(){let b=state.breast;$('feed').innerHTML=`<div class="card"><h2>🍼 Lactancia</h2>${b?`<div class="pill">🤱 Toma de pecho en curso: ${b.side==='left'?'izquierdo':'derecho'}</div><p style="margin-bottom:4px">⏱️ Tiempo total de lactancia</p><div class="big" id="breasttimer">00:00:00</div><p style="margin-bottom:4px">⏱️ Tiempo del pecho actual</p><div class="big" id="sidetimer">00:00:00</div><div class="row"><button class="primary" onclick="toggleBreast()">${b.paused?'▶ Reanudar':'⏸ Pausar'}</button></div><label>Inicio de la toma</label>${input('breastStart',b.start)}<p><button onclick="updateBreastStart()">Corregir inicio</button></p><div class="row"><button onclick="switchBreast()">⇄ Cambiar de pecho</button><button class="primary" onclick="endBreast()">Finalizar toma</button></div><label>Hora de finalización (editable)</label>${input('breastEnd',now())}<p><small>Al cambiar de pecho se guarda la duración de cada lado.</small></p>`:`<div class="row"><button class="${feedType==='bottle'?'selected':''}" onclick="feedType='bottle';render()">🍼 Biberón</button><button class="${feedType==='breast'?'selected':''}" onclick="feedType='breast';render()">🤱 Pecho</button></div>${feedType==='bottle'?`<label>Cantidad (ml)</label><input id="amount" type="number" min="0" step="1" placeholder="Ej. 60"><label>Inicio</label>${input('bottleStart',now())}<label>Final</label>${input('bottleEnd',now())}<p><button class="primary" onclick="addBottle()">Guardar biberón</button></p>`:`<label>Inicio</label>${input('breastStart',now())}<label>Primer pecho</label><div class="row"><button onclick="startBreast('left')">Izquierdo</button><button onclick="startBreast('right')">Derecho</button></div>`}`}</div><div class="card"><h2>Tomas de las últimas 24 horas</h2>${[...recentEntries('bottle'),...recentEntries('breast')].sort((a,b)=>b.start-a.start).map(entryCard).join('')||'<p class="muted">Todavía no hay tomas.</p>'}</div>`}
function addBottle(){let amount=Number($('amount').value),start=fromInput($('bottleStart').value),end=fromInput($('bottleEnd').value);if(!(amount>0)||end<start)return alert('Revisa la cantidad y los horarios');add({type:'bottle',amount,start,end})}function startBreast(side){let start=fromInput($('breastStart').value);state.breast={start,side,segmentStart:start,segments:[],elapsed:0,sideElapsed:0,paused:false};save();render()}function updateBreastStart(){let b=state.breast,n=fromInput($('breastStart').value);if(b.segments.length)return alert('Para corregir una toma con cambios de pecho, finalízala y edítala en el historial.');b.start=n;b.segmentStart=n;b.resumedAt=n;b.sideResumedAt=n;b.elapsed=0;b.sideElapsed=0;save();render()}function toggleBreast(){let b=state.breast;if(b.paused){b.paused=false;b.resumedAt=now();b.sideResumedAt=now()}else{b.elapsed=breastElapsed(b);b.sideElapsed=breastSideElapsed(b);b.paused=true}save();render()}function switchBreast(){let b=state.breast,t=now();b.segments.push({side:b.side,start:b.segmentStart,end:t,durationMs:breastSideElapsed(b)});b.elapsed=breastElapsed(b);b.resumedAt=t;b.side=b.side==='left'?'right':'left';b.segmentStart=t;b.sideElapsed=0;b.sideResumedAt=t;save();render()}function endBreast(){let b=state.breast,t=fromInput($('breastEnd').value);if(t<b.start||t<b.segmentStart)return alert('La hora final no puede ser anterior al inicio o al último cambio de pecho');let segments=[...b.segments,{side:b.side,start:b.segmentStart,end:t,durationMs:Math.max(0,breastSideElapsed(b)+(t-now()))}];add({type:'breast',start:b.start,end:t,segments,activeDurationMs:Math.max(0,breastElapsed(b)+(t-now()))});state.breast=null;save();render()}
function levelButtons(kind,selected){return `<div class="levels">${['1','1.5','2','2.5','3','3+'].map(x=>`<button class="${selected===x?'selected':''}" onclick="${kind==='pee'?`peeLevel='${x}'`:`poopLevel='${x}'`};renderDiaper()">${x}</button>`).join('')}</div>`}function renderDiaper(){$('diaper').innerHTML=`<div class="card"><h2>🧷 Cambio de pañal</h2><div class="row"><button class="${wet?'selected':''}" onclick="wet=!wet;renderDiaper()">💧 Pipí ${wet?'✓':''}</button><button class="${dirty?'selected':''}" onclick="dirty=!dirty;renderDiaper()">💩 Caca ${dirty?'✓':''}</button></div>${wet?`<label>Cantidad de pipí</label>${levelButtons('pee',peeLevel)}`:''}${dirty?`<label>Cantidad de caca</label>${levelButtons('poop',poopLevel)}`:''}<label>Hora del cambio</label>${input('diaperTime',now())}<p><button class="primary" onclick="addDiaper()">Guardar pañal</button></p></div><div class="card"><h2>Pañales de las últimas 24 horas</h2>${recentList('diaper')}</div>`}function addDiaper(){if(!wet&&!dirty)return alert('Marca pipí, caca o ambos');add({type:'diaper',start:fromInput($('diaperTime').value),pee:wet?peeLevel:null,poop:dirty?poopLevel:null});wet=false;dirty=false;render()}
function renderHistory(){let day=dateKey(now()),days=[...new Set(state.records.map(r=>dateKey(r.start)))].sort().reverse();$('history').innerHTML=`<div class="card"><h2>📅 Últimas 24 horas</h2>${summary24()}<p><small>Ventana móvil: se actualiza automáticamente, sin cerrar nada a medianoche. Los registros anteriores permanecen en el historial por fecha.</small></p></div><div class="card"><h2>Consultar días</h2><label>Fecha</label><input type="date" id="historyDay" value="${day}" onchange="showHistoryDay()"><div id="historyResult">${dayDetails(day)}</div></div><div class="card"><h2>Copias de seguridad</h2><div class="row"><button onclick="exportData()">⬇ Exportar JSON</button><button onclick="$('importFile').click()">⬆ Importar JSON</button></div><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(this)"></div>`}
function recentEntries(type){let cutoff=now()-86400000;return state.records.filter(r=>r.type===type&&(r.end??r.start)>=cutoff&&r.start<=now())}function recentList(type){let a=recentEntries(type).sort((a,b)=>b.start-a.start);return a.map(entryCard).join('')||'<p class="muted">Sin registros en las últimas 24 horas.</p>'}function summary24(){let cutoff=now()-86400000,s=recentEntries('sleep'),b=recentEntries('bottle'),p=recentEntries('breast'),d=recentEntries('diaper');let sleepMs=s.reduce((a,r)=>a+Math.max(0,Math.min(r.end,now())-Math.max(r.start,cutoff)),0);if(state.sleep)sleepMs+=Math.max(0,now()-Math.max(state.sleep.start,cutoff));return `<div class="pill">🌙 ${s.length} sueños completados · ${duration(sleepMs)}<br>🍼 ${b.length} biberones · ${b.reduce((a,r)=>a+r.amount,0)} ml<br>🤱 ${p.length} tomas de pecho<br>🧷 ${d.length} pañales · ${d.filter(r=>r.pee).length} pipí · ${d.filter(r=>r.poop).length} caca</div>`}function summary(day){let s=entries('sleep',day),b=entries('bottle',day),p=entries('breast',day),d=entries('diaper',day);return `<div class="pill">🌙 ${s.length} sueños · ${duration(s.reduce((a,r)=>a+r.end-r.start,0))}<br>🍼 ${b.length} biberones · ${b.reduce((a,r)=>a+r.amount,0)} ml<br>🤱 ${p.length} tomas de pecho · ${duration(p.reduce((a,r)=>a+r.end-r.start,0))}<br>🧷 ${d.length} pañales · ${d.filter(r=>r.pee).length} pipí · ${d.filter(r=>r.poop).length} caca</div>`}function dayDetails(day){return `${state.archived.includes(day)?'<p>📁 Día archivado</p>':''}${summary(day)}${['sleep','bottle','breast','diaper'].map(t=>list(t,day)).join('')}`}function showHistoryDay(){$('historyResult').innerHTML=dayDetails($('historyDay').value)}function archiveToday(){let d=dateKey(now());if(!state.archived.includes(d))state.archived.push(d);save();render();alert('Día archivado. Puedes seguir consultándolo y editarlo.')}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`jan-tracker-${dateKey(now())}.json`;a.click();URL.revokeObjectURL(url)}async function importData(el){try{let data=JSON.parse(await el.files[0].text());if(!Array.isArray(data.records))throw Error('Formato incorrecto');if(!confirm('¿Sustituir todos los datos actuales por la copia?'))return;state={records:data.records,sleep:data.sleep||null,breast:data.breast||null,archived:data.archived||[]};save();render()}catch(e){alert('No se pudo importar: '+e.message)}}
function editBreastRecord(id){const r=state.records.find(x=>x.id===id&&x.type==='breast');if(!r)return;const segs=(r.segments?.length?r.segments:[{side:'left',start:r.start,end:r.end}]).map(s=>({...s}));let overlay=document.createElement('div');overlay.id='breastEditor';overlay.style.cssText='position:fixed;inset:0;z-index:9999;background:#12213b99;display:flex;align-items:center;justify-content:center;padding:12px';overlay.innerHTML='<div style="background:white;color:#26354b;border-radius:18px;padding:18px;max-width:520px;width:100%;max-height:90vh;overflow:auto"><h2>🤱 Editar lactància</h2><p><small>Modifica els trams de pit i afegeix pauses per fer el rotet o canviar el bolquer. Les pauses no compten com a lactància activa.</small></p><div id="breastEditRows"></div><div class="row"><button type="button" id="addBreastLeft">+ Esquerra</button><button type="button" id="addBreastRight">+ Dreta</button><button type="button" id="addBreastPause">+ Pausa</button></div><p id="breastEditError" style="color:#bd283c"></p><div class="row"><button type="button" id="cancelBreastEdit">Cancel·lar</button><button class="primary" type="button" id="saveBreastEdit">Guardar canvis</button></div></div>';document.body.appendChild(overlay);const rows=overlay.querySelector('#breastEditRows');function readRows(){return [...rows.querySelectorAll('[data-segment]')].map(el=>({side:el.querySelector('select').value,start:fromInput(el.querySelector('[data-start]').value),end:fromInput(el.querySelector('[data-end]').value)}))}function draw(items){rows.innerHTML=items.map((s,i)=>'<div data-segment style="border:1px solid #dbe3f0;border-radius:12px;padding:10px;margin:8px 0"><div class="row"><strong>Tram '+(i+1)+'</strong><button type="button" data-remove="'+i+'">✕</button></div><label>Tipus</label><select><option value="left" '+(s.side==='left'?'selected':'')+'>Pit esquerre</option><option value="right" '+(s.side==='right'?'selected':'')+'>Pit dret</option><option value="pause" '+(s.side==='pause'?'selected':'')+'>⏸ Pausa (rotet, bolquer...)</option></select><label>Inici</label><input data-start type="datetime-local" value="'+localInput(s.start)+'"><label>Final</label><input data-end type="datetime-local" value="'+localInput(s.end)+'"></div>').join('');rows.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let a=readRows();a.splice(Number(b.dataset.remove),1);draw(a)})}draw(segs);for(const [id,side] of [['addBreastLeft','left'],['addBreastRight','right'],['addBreastPause','pause']])overlay.querySelector('#'+id).onclick=()=>{let a=readRows(),start=a.length?a[a.length-1].end:r.start;draw([...a,{side,start,end:start+60000}]);rows.lastElementChild?.scrollIntoView({block:'nearest'})};overlay.querySelector('#cancelBreastEdit').onclick=()=>overlay.remove();overlay.onclick=e=>{if(e.target===overlay)overlay.remove()};overlay.querySelector('#saveBreastEdit').onclick=()=>{let a=readRows();let err=overlay.querySelector('#breastEditError');if(!a.length||a.some(s=>!Number.isFinite(s.start)||!Number.isFinite(s.end)||s.end<=s.start)){err.textContent='Revisa les hores: cada tram ha de tenir inici i final vàlids.';return}a.sort((x,y)=>x.start-y.start);if(a.some((s,i)=>i>0&&s.start<a[i-1].end)){err.textContent='Hi ha trams que se solapen. Corregeix els horaris.';return}if(!a.some(s=>s.side!=='pause')){err.textContent='Cal almenys un tram de lactància.';return}r.start=a[0].start;r.end=a[a.length-1].end;r.segments=a.map(s=>({...s,durationMs:s.end-s.start}));r.activeDurationMs=a.filter(s=>s.side!=='pause').reduce((n,s)=>n+s.durationMs,0);save();overlay.remove();render()}}
function editRecord(id){let r=state.records.find(x=>x.id===id);if(!r)return;if(r.type==='breast')return editBreastRecord(id);let s=prompt('Inicio (AAAA-MM-DDTHH:MM)',localInput(r.start));if(s===null)return;let start=fromInput(s),end=r.end;if(r.end!==undefined){let e=prompt('Final (AAAA-MM-DDTHH:MM)',localInput(r.end));if(e===null)return;end=fromInput(e);if(end<start)return alert('La hora final debe ser posterior a la inicial')}if(r.type==='sleep'){let place=prompt('Dónde o cómo se durmió',r.sleepPlace||'');if(place===null)return;let reasons=prompt('Motivos del despertar (separados por coma)',(r.wakeReasons||[]).join(', '));if(reasons===null)return;r.sleepPlace=place.trim();r.wakeReasons=reasons.split(',').map(x=>x.trim()).filter(Boolean)}if(r.type==='bottle'){let a=prompt('Cantidad en ml',r.amount);if(a===null)return;if(!(Number(a)>0))return alert('Cantidad inválida');r.amount=Number(a)}if(r.type==='diaper'){let p=prompt('Pipí (vacío, 1, 1.5, 2, 2.5, 3, 3+)',r.pee||'');if(p===null)return;let c=prompt('Caca (vacío, 1, 1.5, 2, 2.5, 3, 3+)',r.poop||'');if(c===null)return;let allowed=['','1','1.5','2','2.5','3','3+'];if(!allowed.includes(p)||!allowed.includes(c)||(!p&&!c))return alert('Niveles inválidos');r.pee=p||null;r.poop=c||null}if(r.type==='breast'){let old=r.end-r.start;let shift=start-r.start;r.segments=r.segments.map(seg=>({...seg,start:seg.start+shift,end:seg.end+shift}));if(r.segments.length){r.segments[r.segments.length-1].end+=end-start-old;if(r.segments.some(seg=>seg.end<seg.start))return alert('Duración inválida para un segmento')}}r.start=start;if(r.end!==undefined)r.end=end;save();render()}
